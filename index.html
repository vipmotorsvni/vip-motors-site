<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Vip Motors</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Vip Motors - Oficina premium para motos">

  <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- HEADER -->
<header id="header">

  <nav class="menu">
    <a onclick="abrirPagina('pecas')">Peças</a>
    <a onclick="abrirPagina('acessorios')">Acessórios</a>
    <a onclick="abrirPagina('capacetes')">Capacetes</a>
  </nav>

  <img src="Vip logo png.png" class="logo">

</header>

<!-- HERO / CARROSSEL -->
<section class="hero">

  <div class="slide active" style="background-image: url('Fora Loja.jpg')"></div>
  <div class="slide" style="background-image: url('ZX6 Loja.jpg')"></div>
  <div class="slide" style="background-image: url('Dentro Loja.jpg')"></div>

</section>

<!-- PÁGINAS -->
<main id="paginas">

  <section id="pecas" class="pagina ativa">
    <h2>Peças</h2>
    <div class="grid">
      <div class="card">Freios</div>
      <div class="card">Correntes</div>
      <div class="card">Filtros</div>
    </div>
  </section>

  <section id="acessorios" class="pagina">
    <h2>Acessórios</h2>
    <div class="grid">
      <div class="card">Luvas</div>
      <div class="card">Suporte Celular</div>
      <div class="card">Baú</div>
    </div>
  </section>

  <section id="capacetes" class="pagina">
    <h2>Capacetes</h2>
    <div class="grid">
      <div class="card">Capacete Esportivo</div>
      <div class="card">Capacete Urbano</div>
      <div class="card">Capacete Off-road</div>
    </div>
  </section>

</main>

<!-- WHATS -->
<a class="whatsapp-topo" onclick="whatsapp()">
  <img src="https://cdn-icons-png.flaticon.com/512/733/733585.png" alt="WhatsApp">
</a>

<script src="script.js"></script>

<!-- 🔥 RODAPÉ -->
<footer class="footer">

  <div class="footer-content">
    <p><strong>Endereço:</strong> Rua Fioravante Zandonade Nº 60, Bairro Marmim</p>
    <p>Venda Nova do Imigrante - ES</p>
    <p>© 2026 Vip Motors Ltda.</p>
  </div>

</footer>

</body>
</html>
